<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Histogram Bin Explorer</title>
  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: white;
      padding: 20px;
    }
    
    .container {
      max-width: 700px;
      margin: 0 auto;
    }
    
    h1 {
      font-size: 20px;
      font-weight: 600;
      color: #111;
      margin-bottom: 4px;
    }
    
    .subtitle {
      font-size: 14px;
      color: #666;
      margin-bottom: 20px;
    }
    
    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding: 12px;
      background: #f9fafb;
      border-radius: 8px;
    }
    
    .controls label {
      font-size: 14px;
      font-weight: 500;
      color: #374151;
    }
    
    .controls input[type="range"] {
      flex: 1;
      height: 6px;
      border-radius: 3px;
      background: #d1d5db;
      outline: none;
      -webkit-appearance: none;
    }
    
    .controls input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #3b82f6;
      cursor: pointer;
    }
    
    .value-display {
      font-size: 16px;
      font-weight: 600;
      color: #3b82f6;
      min-width: 40px;
      text-align: right;
    }
    
    #chart {
      margin-bottom: 12px;
    }
    
    .note {
      font-size: 12px;
      color: #9ca3af;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Histogram Bin Explorer</h1>
    <p class="subtitle">See how bin choice changes the shape</p>
    
    <div class="controls">
      <label for="bins">Bins:</label>
      <input 
        type="range" 
        id="bins" 
        min="2" 
        max="60" 
        value="10"
      >
      <span class="value-display" id="binValue">10</span>
    </div>
    
    <div id="chart"></div>
    <p class="note">Generated sample data with fixed seed</p>
  </div>

  <script>
    let currentBins = 10;
    let chartSpec = null;
    
    // Load initial data from parent (ChatGPT)
    if (window.openai?.data?._meta) {
      const { chartSpec: spec, bins } = window.openai.data._meta;
      chartSpec = spec;
      currentBins = bins;
      document.getElementById('bins').value = bins;
      document.getElementById('binValue').textContent = bins;
      renderChart();
    }
    
    // Handle slider changes
    document.getElementById('bins').addEventListener('input', async (e) => {
      const newBins = parseInt(e.target.value);
      document.getElementById('binValue').textContent = newBins;
      
      if (newBins !== currentBins) {
        currentBins = newBins;
        await fetchNewData(newBins);
      }
    });
    
    // Fetch new histogram data
    async function fetchNewData(bins) {
      try {
        const response = await fetch('http://localhost:3000/mcp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            method: 'tools/call',
            params: {
              name: 'get_histogram',
              arguments: { bins }
            }
          })
        });
        
        const data = await response.json();
        if (data._meta?.chartSpec) {
          chartSpec = data._meta.chartSpec;
          renderChart();
        }
      } catch (error) {
        console.error('Failed to fetch histogram:', error);
      }
    }
    
    // Render chart with Vega-Lite
    function renderChart() {
      if (chartSpec) {
        vegaEmbed('#chart', chartSpec, {
          actions: false,
          renderer: 'svg'
        }).catch(console.error);
      }
    }
  </script>
</body>
</html>
